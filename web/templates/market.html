{% extends "base.html" %}
{% block title %}市场 — 先行指标全景{% endblock %}

{% block content %}
<div x-data="market()" x-init="load()">

  <section style="padding:20px 0 12px;">
    <div class="container">
      <h1 style="font-size:20px; font-weight:700; margin:0;">市场全景</h1>
      <div class="text-sm text-muted" style="margin-top:4px;">先行信号 → 传导链 → A股板块</div>
    </div>
  </section>

  <!-- Charts row -->
  <section style="padding:0 0 16px;">
    <div class="container">
      <div style="display:grid; grid-template-columns:1fr 1fr; gap:16px;">
        <div class="card">
          <div class="card__header" style="padding:10px 16px;">
            <div class="card__title" style="font-size:13px;"><div class="card__title-icon" style="background:var(--warning);"></div>库存趋势</div>
            <div class="card__subtitle" style="font-size:10px;">SHFE · 库存下降→价格上涨压力</div>
          </div>
          <div class="card__body card__body--flush"><div id="inventory-chart" style="width:100%;height:200px;"></div></div>
        </div>
        <div class="card">
          <div class="card__header" style="padding:10px 16px;">
            <div class="card__title" style="font-size:13px;"><div class="card__title-icon" style="background:#f59e0b;"></div>商品期货</div>
            <div class="card__subtitle" style="font-size:10px;">铜/锡/镍/铝 · 传导到A股有1-3天时滞</div>
          </div>
          <div class="card__body card__body--flush"><div id="price-chart" style="width:100%;height:200px;"></div></div>
        </div>
      </div>
    </div>
  </section>

  <!-- Signal Flow Chain — 精细化版本 -->
  <section style="padding:0 0 16px;">
    <div class="container">
      <div class="card">
        <div class="card__header" style="padding:12px 18px;">
          <div class="card__title"><div class="card__title-icon"></div>信号传导链</div>
          <div style="display:flex;gap:16px;font-size:11px;color:var(--text-muted);">
            <span><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--down);margin-right:4px;"></span>看空信号</span>
            <span><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--up);margin-right:4px;"></span>看多信号</span>
            <span><span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:var(--accent);margin-right:4px;"></span>信号源</span>
            <span>连线粗细 = 置信度</span>
          </div>
        </div>
        <div class="card__body" style="padding:20px 24px;">

          <!-- 三列布局: 信号源 → 传导箭头 → 板块信号 -->
          <div style="display:grid; grid-template-columns:180px 1fr 1fr; gap:0; align-items:start;">

            <!-- Column 1: 信号源 -->
            <div>
              <div style="font-size:10px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:12px;">先行信号源</div>
              <template x-for="src in signalSources" :key="src.key">
                <div class="flow-source-node">
                  <div class="flow-source-icon" :style="'background:' + src.color">
                    <i :class="src.icon"></i>
                  </div>
                  <div>
                    <div style="font-weight:600;font-size:13px;" x-text="src.name"></div>
                    <div style="font-size:10px;color:var(--text-muted);" x-text="src.desc"></div>
                  </div>
                  <div class="flow-source-badge" x-show="src.signalCount > 0" x-text="src.signalCount"></div>
                </div>
              </template>
            </div>

            <!-- Column 2: 传导箭头区 -->
            <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;padding-top:30px;">
              <div style="font-size:10px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:16px;">信号传导</div>
              <template x-for="link in flowLinks" :key="link.from + link.to">
                <div class="flow-link-row">
                  <span class="flow-link-from" x-text="link.fromName"></span>
                  <div class="flow-link-line" :style="'background:' + link.color + ';width:' + link.width + 'px;'"></div>
                  <span class="flow-link-arrow" :style="'color:' + link.color">›</span>
                  <span class="flow-link-to" x-text="link.toName"></span>
                  <span class="flow-link-conf" :style="'color:' + link.color" x-text="link.confLabel"></span>
                </div>
              </template>
            </div>

            <!-- Column 3: 板块信号 -->
            <div>
              <div style="font-size:10px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:12px;">A股板块信号</div>
              <template x-for="sec in sectorSignals" :key="sec.name">
                <div class="flow-sector-node" :class="sec.direction > 0 ? 'flow-sector--bull' : sec.direction < 0 ? 'flow-sector--bear' : 'flow-sector--neutral'">
                  <div style="display:flex;align-items:center;justify-content:space-between;">
                    <div>
                      <span style="font-weight:600;font-size:13px;" x-text="sec.name"></span>
                      <span style="font-size:10px;color:var(--text-muted);margin-left:6px;" x-text="sec.stocks"></span>
                    </div>
                    <div style="display:flex;align-items:center;gap:6px;">
                      <span class="flow-dir-badge" :class="sec.direction > 0 ? 'flow-dir--up' : sec.direction < 0 ? 'flow-dir--down' : 'flow-dir--flat'"
                            x-text="sec.direction > 0 ? '看多' : sec.direction < 0 ? '看空' : '中性'"></span>
                      <span class="flow-conf-pill" :style="'color:' + (sec.direction > 0 ? 'var(--up)' : sec.direction < 0 ? 'var(--down)' : 'var(--text-muted)')"
                            x-text="sec.confPct + '%'"></span>
                    </div>
                  </div>
                  <!-- 置信度进度条 -->
                  <div style="margin-top:6px;height:3px;background:var(--bg-tertiary);border-radius:2px;overflow:hidden;">
                    <div :style="'height:100%;width:' + sec.confPct + '%;border-radius:2px;background:' + (sec.direction > 0 ? 'var(--up)' : sec.direction < 0 ? 'var(--down)' : 'var(--text-muted)')"></div>
                  </div>
                  <!-- 信号来源标签 -->
                  <div style="display:flex;gap:4px;margin-top:6px;flex-wrap:wrap;">
                    <template x-for="src in sec.sources" :key="src">
                      <span class="flow-src-tag" x-text="srcLabel(src)"></span>
                    </template>
                  </div>
                </div>
              </template>
            </div>

          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- Capital + Overseas -->
  <section style="padding:0 0 24px;">
    <div class="container">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;">
        <div class="card">
          <div class="card__header" style="padding:10px 16px;">
            <div class="card__title" style="font-size:13px;"><div class="card__title-icon" style="background:var(--up);"></div>资金流向</div>
          </div>
          <div class="card__body">
            <div style="padding:8px 0;border-bottom:1px solid var(--border);">
              <div style="display:flex;justify-content:space-between;align-items:center;">
                <span style="font-weight:500;font-size:12px;">北向资金净流入</span>
                <span class="mono" :class="(northbound.total_net_yi||0)>=0?'text-up':'text-down'" x-text="(northbound.total_net_yi||0).toFixed(1)+'亿'"></span>
              </div>
            </div>
            <template x-for="sig in capital_signals.slice(0,5)" :key="sig.id">
              <div style="padding:6px 0;border-bottom:1px solid var(--border);font-size:12px;">
                <div style="font-weight:500;" x-text="sig.description"></div>
                <div class="text-xs text-muted" style="margin-top:2px;">
                  <span :class="sig.direction==='bullish'?'text-up':'text-down'" x-text="sig.direction==='bullish'?'利好':'利空'"></span>
                  · <span x-text="Math.round(sig.confidence*100)+'%'"></span>
                </div>
              </div>
            </template>
            <div x-show="capital_signals.length===0" class="text-xs text-muted" style="padding:12px;text-align:center;">交易日自动采集</div>
          </div>
        </div>
        <div class="card">
          <div class="card__header" style="padding:10px 16px;">
            <div class="card__title" style="font-size:13px;"><div class="card__title-icon" style="background:var(--accent);"></div>海外龙头</div>
          </div>
          <div class="card__body card__body--flush">
            <template x-for="s in overseas" :key="s.symbol">
              <div style="padding:10px 14px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;">
                <div>
                  <div style="font-weight:600;font-size:13px;" x-text="s.name"></div>
                  <div class="text-xs" style="color:var(--accent);" x-text="(s.affects||[]).join(' / ')"></div>
                </div>
                <div style="text-align:right;">
                  <div class="mono" :class="(s.change_pct||0)>=0?'text-up':'text-down'" x-text="((s.change_pct||0)>=0?'+':'')+(s.change_pct||0).toFixed(1)+'%'"></div>
                  <div class="text-xs text-muted mono" x-text="'$'+(s.close||0).toFixed(2)"></div>
                </div>
              </div>
            </template>
          </div>
        </div>
      </div>
    </div>
  </section>

</div>
{% endblock %}

{% block scripts %}
<script>
function market() {
  return {
    overseas: [],
    sectors: {},
    northbound: {},
    capital_signals: [],
    inventoryData: {},
    materialData: {},
    signalSources: [],
    sectorSignals: [],
    flowLinks: [],

    srcLabel(s) {
      return {inventory:'库存',capital:'资金',commodity:'商品',overseas:'海外',announcement:'公告',correlator:'共振'}[s]||s;
    },

    async load() {
      try {
        const [dashRes, sigRes, invRes, matRes] = await Promise.all([
          fetch('/api/dashboard'), fetch('/api/signals/v2'),
          fetch('/api/inventory/history'), fetch('/api/materials/history')
        ]);
        const d = await dashRes.json();
        const sigData = await sigRes.json();
        const signals = sigData.signals || [];

        this.overseas = d.overseas || [];
        this.sectors = d.sectors || {};
        this.northbound = d.northbound || {};
        this.capital_signals = signals.filter(s => s.source === 'capital');
        this.inventoryData = await invRes.json();
        this.materialData = await matRes.json();

        // 构建信号源
        this.buildSignalSources(signals);
        // 构建板块信号
        this.buildSectorSignals(signals);
        // 构建传导链
        this.buildFlowLinks(signals);

        this.$nextTick(() => {
          this.renderInventoryChart();
          this.renderPriceChart();
        });
      } catch (e) {
        console.error('Market load error:', e);
      }
    },

    buildSignalSources(signals) {
      const srcMap = {};
      const defs = {
        inventory: {name:'SHFE库存',desc:'供需基本面',icon:'fa-solid fa-warehouse',color:'#f59e0b'},
        capital:   {name:'机构资金',desc:'龙虎榜/融资',icon:'fa-solid fa-money-bill-trend-up',color:'#059669'},
        commodity: {name:'商品期货',desc:'铜/锡/镍/铝',icon:'fa-solid fa-oil-well',color:'#8b5cf6'},
        overseas:  {name:'海外映射',desc:'NVDA/TSM等',icon:'fa-solid fa-globe',color:'#3b82f6'},
        announcement:{name:'公告雷达',desc:'中标/增持',icon:'fa-solid fa-file-lines',color:'#ec4899'},
        correlator:{name:'多源共振',desc:'交叉验证',icon:'fa-solid fa-link',color:'#f97316'},
      };
      signals.forEach(s => {
        if (!srcMap[s.source]) srcMap[s.source] = {key:s.source, signalCount:0, ...defs[s.source]};
        srcMap[s.source].signalCount++;
      });
      this.signalSources = Object.values(srcMap).sort((a,b) => b.signalCount - a.signalCount);
    },

    buildSectorSignals(signals) {
      const secMap = {};
      signals.forEach(s => {
        const sectors = JSON.parse(s.target_sectors || '[]');
        sectors.forEach(sec => {
          if (!secMap[sec]) secMap[sec] = {name:sec, bull:0, bear:0, maxConf:0, sources:new Set()};
          if (s.direction==='bullish') secMap[sec].bull += s.confidence||0;
          else if (s.direction==='bearish') secMap[sec].bear += s.confidence||0;
          secMap[sec].maxConf = Math.max(secMap[sec].maxConf, s.confidence||0);
          secMap[sec].sources.add(s.source);
        });
      });
      const stocksMap = {
        '光模块':'中际旭创/新易盛','服务器':'工业富联/浪潮信息','PCB':'深南电路/兴森科技',
        '封装':'长电科技/通富微电','液冷':'英维克','国产算力':'寒武纪/海光信息',
        '锡':'锡业股份','铜':'紫金矿业','铜缆':'沃尔核材',
      };
      this.sectorSignals = Object.values(secMap).map(s => ({
        name: s.name, stocks: stocksMap[s.name]||'',
        direction: s.bull > s.bear ? 1 : s.bear > s.bull ? -1 : 0,
        confPct: Math.round(s.maxConf * 100),
        sources: [...s.sources],
      })).sort((a,b) => b.confPct - a.confPct);
    },

    buildFlowLinks(signals) {
      const links = [];
      const linkMap = {};
      const srcNames = {inventory:'SHFE库存',capital:'机构资金',commodity:'商品期货',overseas:'海外映射',correlator:'多源共振',announcement:'公告'};
      const affects = {
        'overseas': ['光模块','服务器','PCB','封装','液冷','国产算力'],
        'inventory': ['锡','铜','封装','PCB'],
        'capital': ['锡','光模块','PCB','服务器'],
        'commodity': ['锡','铜','PCB'],
        'correlator': ['封装','PCB','光模块'],
      };

      signals.forEach(s => {
        const sectors = JSON.parse(s.target_sectors || '[]');
        sectors.forEach(sec => {
          const key = s.source + '→' + sec;
          if (!linkMap[key]) {
            linkMap[key] = {from:s.source, to:sec, fromName:srcNames[s.source]||s.source, toName:sec, conf:0, dir:0};
          }
          linkMap[key].conf = Math.max(linkMap[key].conf, s.confidence||0);
          if (s.direction==='bearish') linkMap[key].dir = -1;
          else if (s.direction==='bullish' && linkMap[key].dir===0) linkMap[key].dir = 1;
        });
      });

      this.flowLinks = Object.values(linkMap).map(l => ({
        ...l,
        color: l.dir > 0 ? 'var(--up)' : l.dir < 0 ? 'var(--down)' : 'var(--text-muted)',
        width: Math.max(2, Math.round(l.conf * 6)),
        confLabel: Math.round(l.conf * 100) + '%',
      })).sort((a,b) => b.conf - a.conf).slice(0, 12);
    },

    inventoryLatest(commodity) {
      const d = this.inventoryData[commodity];
      return d && d.length > 0 ? d[d.length-1].stockpile.toLocaleString() + '吨' : 'N/A';
    },
    materialLatest(material) {
      const d = this.materialData[material];
      return d && d.length > 0 ? d[d.length-1].price.toLocaleString() + '元' : 'N/A';
    },

    renderInventoryChart() {
      const el = document.getElementById('inventory-chart');
      if (!el) return;
      const chart = echarts.init(el);
      const names = {tin:'锡',copper:'铜',nickel:'镍',aluminum:'铝'};
      const colors = ['#f59e0b','#ef4444','#3b82f6','#8b5cf6'];
      const series = [];
      Object.entries(this.inventoryData).forEach(([c,data],i) => {
        if (!data||!data.length) return;
        series.push({name:names[c]||c,type:'line',smooth:true,symbol:'circle',symbolSize:3,lineStyle:{width:1.5},data:data.map(d=>[d.date,d.stockpile])});
      });
      chart.setOption({backgroundColor:'transparent',color:colors,
        tooltip:{trigger:'axis'},
        legend:{top:0,textStyle:{color:'#94a3b8',fontSize:10}},
        grid:{left:45,right:8,top:24,bottom:20},
        xAxis:{type:'category',axisLabel:{color:'#64748b',fontSize:8},axisLine:{lineStyle:{color:'#334155'}},boundaryGap:false},
        yAxis:{type:'value',axisLabel:{color:'#64748b',fontSize:8,formatter:v=>(v/1000).toFixed(0)+'k'},splitLine:{lineStyle:{color:'#1e293b'}}},
        series});
      window.addEventListener('resize',()=>chart.resize());
    },

    renderPriceChart() {
      const el = document.getElementById('price-chart');
      if (!el) return;
      const chart = echarts.init(el);
      const names = {copper:'铜',tin:'锡',nickel:'镍',aluminum:'铝'};
      const colors = ['#ef4444','#f59e0b','#3b82f6','#8b5cf6'];
      const series = [];
      Object.entries(this.materialData).forEach(([m,data],i) => {
        if (!data||!data.length) return;
        series.push({name:names[m]||m,type:'line',smooth:true,symbol:'none',lineStyle:{width:1.5},data:data.map(d=>[d.date,d.price])});
      });
      chart.setOption({backgroundColor:'transparent',color:colors,
        tooltip:{trigger:'axis'},
        legend:{top:0,textStyle:{color:'#94a3b8',fontSize:10}},
        grid:{left:50,right:8,top:24,bottom:20},
        xAxis:{type:'category',axisLabel:{color:'#64748b',fontSize:8},axisLine:{lineStyle:{color:'#334155'}},boundaryGap:false},
        yAxis:{type:'value',axisLabel:{color:'#64748b',fontSize:8},splitLine:{lineStyle:{color:'#1e293b'}}},
        series});
      window.addEventListener('resize',()=>chart.resize());
    }
  };
}
</script>
{% endblock %}
