{% extends "base.html" %}

{% block title %}{{ code }} — AI产业链监控{% endblock %}

{% block content %}
<div x-data="stockPage('{{ code }}')" x-init="load()">

  <!-- Stock Hero -->
  <section style="padding:24px 0 8px;">
    <div class="container">
      <a href="/" class="btn" style="font-size:11px; padding:4px 10px; margin-bottom:16px;">
        <i class="fa-solid fa-arrow-left" style="font-size:9px;"></i> 返回总览
      </a>

      <div class="card">
        <div class="stock-hero" x-show="!loading && detail">
          <div class="stock-hero__sector" x-text="detail.sector"></div>
          <div class="stock-hero__name" x-text="detail.name"></div>
          <div class="stock-hero__code" x-text="detail.code"></div>
          <div class="stock-hero__price" :class="changePct >= 0 ? 'text-up' : 'text-down'" x-text="latestPrice"></div>
          <div class="stock-hero__change" :class="changePct >= 0 ? 'text-up' : 'text-down'" x-text="changePctStr"></div>
          <div class="stock-stats">
            <div class="stock-stat">
              <div class="stock-stat__label">PE(TTM)</div>
              <div class="stock-stat__value" x-text="peTtm"></div>
            </div>
            <div class="stock-stat">
              <div class="stock-stat__label">PB</div>
              <div class="stock-stat__value" x-text="pb"></div>
            </div>
            <div class="stock-stat">
              <div class="stock-stat__label">总市值</div>
              <div class="stock-stat__value" x-text="totalMv"></div>
            </div>
            <div class="stock-stat">
              <div class="stock-stat__label">60日涨跌</div>
              <div class="stock-stat__value" :class="day60Change >= 0 ? 'text-up' : 'text-down'" x-text="day60ChangeStr"></div>
            </div>
          </div>
        </div>
        <div x-show="loading" class="loading"><span class="spinner"></span>加载中...</div>
      </div>
    </div>
  </section>

  <!-- K-line Chart -->
  <section style="padding:16px 0;">
    <div class="container">
      <div class="card">
        <div class="card__header">
          <div class="card__title">
            <div class="card__title-icon"></div>
            K线走势
          </div>
          <div class="card__subtitle">60日</div>
        </div>
        <div class="card__body card__body--flush">
          <div id="kline-chart" class="chart-container"></div>
        </div>
      </div>
    </div>
  </section>

  <!-- Multi-dimensional Data -->
  <section style="padding:0 0 24px;">
    <div class="container">
      <div style="display:grid; grid-template-columns:1fr 1fr; gap:16px;">

        <!-- Northbound -->
        <div class="card">
          <div class="card__header">
            <div class="card__title">
              <div class="card__title-icon" style="background:var(--up);"></div>
              北向资金
            </div>
          </div>
          <div class="card__body">
            <div style="text-align:center;">
              <div class="text-2xl font-bold"
                   :class="detail && detail.northbound && detail.northbound.consecutive_days > 0 ? 'text-up' : 'text-muted'"
                   x-text="detail && detail.northbound ? detail.northbound.consecutive_days + '天连续买入' : '无连续买入'"></div>
              <div class="text-sm text-muted" style="margin-top:4px;"
                   x-text="detail && detail.northbound && detail.northbound.total_yi > 0 ? '累计 ' + detail.northbound.total_yi + ' 亿' : ''"></div>
            </div>
          </div>
        </div>

        <!-- Margin -->
        <div class="card">
          <div class="card__header">
            <div class="card__title">
              <div class="card__title-icon" style="background:var(--accent);"></div>
              融资融券
            </div>
          </div>
          <div class="card__body">
            <template x-if="detail && detail.margin && detail.margin.length > 0">
              <div style="text-align:center;">
                <div class="text-2xl font-bold" x-text="detail.margin[0].rz_balance_yi + '亿'"></div>
                <div class="text-sm text-muted" style="margin-top:4px;">融资余额</div>
              </div>
            </template>
            <template x-if="!detail || !detail.margin || detail.margin.length === 0">
              <div class="empty-state" style="padding:24px;">
                <div class="empty-state__text">暂无数据</div>
              </div>
            </template>
          </div>
        </div>

      </div>
    </div>
  </section>

</div>
{% endblock %}

{% block scripts %}
<script>
function stockPage(code) {
  return {
    loading: true,
    detail: null,

    get latestPrice() {
      const k = this.detail && this.detail.kline;
      return k && k.length > 0 ? k[0].close.toFixed(2) : 'N/A';
    },
    get changePct() {
      const k = this.detail && this.detail.kline;
      if (!k || k.length < 2) return 0;
      return ((k[0].close - k[1].close) / k[1].close * 100);
    },
    get changePctStr() {
      return (this.changePct >= 0 ? '+' : '') + this.changePct.toFixed(2) + '%';
    },
    get peTtm() {
      const v = this.detail && this.detail.valuation;
      return v && v.pe_ttm ? v.pe_ttm.toFixed(1) : 'N/A';
    },
    get pb() {
      const v = this.detail && this.detail.valuation;
      return v && v.pb ? v.pb.toFixed(2) : 'N/A';
    },
    get totalMv() {
      const v = this.detail && this.detail.valuation;
      return v && v.total_mv ? v.total_mv.toFixed(0) + '亿' : 'N/A';
    },
    get day60Change() {
      const v = this.detail && this.detail.valuation;
      return v && v['60day_change'] ? v['60day_change'] : 0;
    },
    get day60ChangeStr() {
      return (this.day60Change >= 0 ? '+' : '') + this.day60Change.toFixed(1) + '%';
    },

    async load() {
      try {
        const r = await fetch('/api/stock/' + code + '/detail');
        this.detail = await r.json();
        this.loading = false;
        this.$nextTick(() => this.renderKline());
      } catch (e) {
        console.error('Stock load error:', e);
        this.loading = false;
      }
    },

    renderKline() {
      const k = this.detail && this.detail.kline;
      if (!k || k.length === 0) return;
      const el = document.getElementById('kline-chart');
      if (!el) return;

      const chart = echarts.init(el);
      const sorted = [...k].reverse();
      const dates = sorted.map(d => d.date);
      const closes = sorted.map(d => d.close);
      const volumes = sorted.map(d => d.volume);

      chart.setOption({
        backgroundColor: 'transparent',
        tooltip: { trigger: 'axis' },
        xAxis: {
          type: 'category', data: dates,
          axisLine: { lineStyle: { color: '#e2e8f0' } },
          axisLabel: { color: '#94a3b8', fontSize: 11 }
        },
        yAxis: [
          {
            type: 'value', splitLine: { lineStyle: { color: '#f1f5f9' } },
            axisLabel: { color: '#94a3b8', fontSize: 11 }
          },
          {
            type: 'value', splitLine: { show: false },
            axisLabel: { color: '#94a3b8', fontSize: 11, formatter: v => (v/10000).toFixed(0) + '万' }
          }
        ],
        series: [
          {
            name: '收盘价', type: 'line', data: closes, smooth: true,
            lineStyle: { color: '#2563eb', width: 2 },
            itemStyle: { color: '#2563eb' },
            areaStyle: {
              color: {
                type: 'linear', x: 0, y: 0, x2: 0, y2: 1,
                colorStops: [
                  { offset: 0, color: 'rgba(37,99,235,0.12)' },
                  { offset: 1, color: 'rgba(37,99,235,0)' }
                ]
              }
            }
          },
          {
            name: '成交量', type: 'bar', yAxisIndex: 1, data: volumes,
            itemStyle: { color: 'rgba(37,99,235,0.2)' }
          }
        ],
        grid: { left: 60, right: 30, top: 20, bottom: 40 },
      });
      window.addEventListener('resize', () => chart.resize());
    }
  };
}
</script>
{% endblock %}
