{% extends "base.html" %}
{% block title %}报告 — AI研判+消息验证{% endblock %}

{% block content %}
<div x-data="reportPage()" x-init="load()">

  <!-- Header -->
  <section style="padding:20px 0 12px;">
    <div class="container">
      <h1 style="font-size:20px; font-weight:700; margin:0;">分析报告</h1>
      <div class="text-sm text-muted" style="margin-top:4px;">
        AI综合研判 · 消息验证信号
      </div>
    </div>
  </section>

  <!-- AI Full Report -->
  <section style="padding:0 0 16px;">
    <div class="container">
      <div class="card" style="border-left:3px solid var(--accent);">
        <div class="card__header">
          <div class="card__title"><i class="fa-solid fa-brain" style="color:var(--accent); margin-right:6px;"></i>AI综合研判</div>
          <div class="text-xs text-muted" x-text="report?.timestamp ? '生成于 ' + report.timestamp.substring(5,16) : ''"></div>
        </div>
        <div class="card__body">
          <!-- Summary -->
          <div style="font-size:16px; font-weight:600; margin-bottom:16px; line-height:1.5;" x-text="report?.summary || '加载中...'"></div>

          <!-- Stats row -->
          <div style="display:flex; gap:20px; margin-bottom:16px; font-size:13px;">
            <span>分析 <strong x-text="report?.signals_reviewed || 0"></strong> 个信号</span>
            <span>偏多 <strong class="text-up" x-text="report?.bullish_sectors || 0"></strong> 板块</span>
            <span>偏空 <strong class="text-down" x-text="report?.bearish_sectors || 0"></strong> 板块</span>
          </div>

          <!-- Top Calls -->
          <template x-if="report?.top_calls?.length > 0">
            <div style="margin-bottom:16px;">
              <div style="font-weight:600; font-size:13px; margin-bottom:10px;">板块研判</div>
              <div style="display:flex; flex-direction:column; gap:8px;">
                <template x-for="call in report.top_calls" :key="call.sector">
                  <div style="padding:12px; background:var(--bg-tertiary); border-radius:var(--radius); border-left:3px solid"
                       :style="'border-color:' + (call.direction === 'bearish' ? 'var(--down)' : 'var(--up)')">
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                      <div>
                        <span style="font-weight:600;" x-text="call.sector"></span>
                        <span class="badge" style="margin-left:6px;"
                              :class="call.direction === 'bearish' ? 'badge--down' : 'badge--up'"
                              x-text="call.direction === 'bearish' ? '偏空' : '偏多'"></span>
                        <span class="badge badge--muted" style="margin-left:4px;" x-text="call.severity"></span>
                      </div>
                      <div class="mono" style="font-weight:600;"
                           :class="call.direction === 'bearish' ? 'text-down' : 'text-up'"
                           x-text="Math.round(call.confidence * 100) + '%'"></div>
                    </div>
                    <div style="font-size:12px; color:var(--text-muted); margin-top:6px;" x-text="call.action"></div>
                    <div style="font-size:11px; color:var(--text-muted); margin-top:4px;">
                      来源: <span x-text="(call.sources||[]).map(s => sourceName(s)).join('、')"></span>
                      · 标的: <span x-text="(call.affected_stocks||[]).join(', ')"></span>
                    </div>
                  </div>
                </template>
              </div>
            </div>
          </template>

          <!-- Risk Alerts -->
          <template x-if="report?.risk_alerts?.length > 0">
            <div style="margin-bottom:16px;">
              <div style="font-weight:600; font-size:13px; margin-bottom:10px; color:var(--warning);">
                <i class="fa-solid fa-triangle-exclamation"></i> 风险提示
              </div>
              <template x-for="risk in report.risk_alerts" :key="risk.description">
                <div style="padding:8px 12px; margin-bottom:4px; background:var(--bg-tertiary); border-radius:var(--radius); font-size:12px;">
                  <span class="badge badge--muted" style="margin-right:6px;" x-text="risk.severity"></span>
                  <span x-text="risk.description"></span>
                </div>
              </template>
            </div>
          </template>

          <!-- AI Enhancement -->
          <template x-if="report?.ai_enhancement">
            <div style="padding:14px; background:rgba(59,130,246,0.05); border:1px solid rgba(59,130,246,0.2); border-radius:var(--radius);">
              <div style="font-weight:600; font-size:12px; color:var(--accent); margin-bottom:8px;">
                <i class="fa-solid fa-robot"></i> AI深度分析 (DeepSeek)
              </div>
              <div style="font-size:13px; line-height:1.7; white-space:pre-wrap;" x-text="report.ai_enhancement"></div>
            </div>
          </template>

          <!-- Data Gaps -->
          <template x-if="report?.data_gaps?.length > 0">
            <div style="margin-top:12px;">
              <div class="text-xs text-muted"><i class="fa-solid fa-circle-info"></i> 数据缺口:</div>
              <template x-for="gap in report.data_gaps" :key="gap">
                <div class="text-xs text-muted" style="margin-left:12px;" x-text="'· ' + gap"></div>
              </template>
            </div>
          </template>
        </div>
      </div>
    </div>
  </section>

  <!-- News Validation Stream -->
  <section style="padding:0 0 24px;">
    <div class="container">
      <div class="card">
        <div class="card__header">
          <div class="card__title"><i class="fa-solid fa-newspaper" style="margin-right:6px;"></i>消息验证流</div>
          <div class="card__subtitle">新闻/公告用于印证已有信号，不是信息来源</div>
        </div>
        <div class="card__body card__body--flush">
          <div style="max-height:500px; overflow-y:auto;">
            <template x-for="item in news" :key="item.id">
              <div style="padding:12px 16px; border-bottom:1px solid var(--border); display:flex; gap:12px; align-items:flex-start;">
                <div style="min-width:50px; text-align:center;">
                  <span class="badge" :class="item.relevance === 'high' ? 'badge--warning' : 'badge--muted'"
                        x-text="item.relevance === 'high' ? '高相关' : '一般'"></span>
                </div>
                <div style="flex:1; min-width:0;">
                  <div style="display:flex; gap:6px; margin-bottom:4px;">
                    <span class="badge badge--accent" x-text="item.source === 'cls_telegraph' ? '财联社' : item.source === 'cninfo' ? '公告' : item.source === 'eastmoney' ? '研报' : '新闻'"></span>
                    <span x-show="item.ai_direction" class="badge"
                          :class="item.ai_direction === 'bullish' ? 'badge--up' : item.ai_direction === 'bearish' ? 'badge--down' : 'badge--muted'"
                          x-text="item.ai_direction === 'bullish' ? '利好' : item.ai_direction === 'bearish' ? '利空' : '中性'"></span>
                  </div>
                  <a :href="item.url || '#'" target="_blank" style="font-weight:500; font-size:13px; color:var(--text-primary); text-decoration:none;"
                     x-text="item.title"></a>
                  <div x-show="item.ai_reason" class="text-xs text-muted" style="margin-top:3px;" x-text="item.ai_reason"></div>
                </div>
                <div class="text-xs text-muted" style="white-space:nowrap;" x-text="item.date || ''"></div>
              </div>
            </template>
            <div x-show="news.length === 0" class="empty-state" style="padding:30px;">
              <div class="empty-state__icon"><i class="fa-solid fa-newspaper"></i></div>
              <div class="empty-state__text">暂无消息</div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>

</div>
{% endblock %}

{% block scripts %}
<script>
function reportPage() {
  return {
    report: null,
    news: [],

    async load() {
      try {
        const [reportRes, newsRes] = await Promise.all([
          fetch('/api/report'),
          fetch('/api/news?limit=30')
        ]);
        this.report = await reportRes.json();
        this.news = await newsRes.json();
      } catch (e) {
        console.error('Report load error:', e);
      }
    },

    sourceName(src) {
      return {inventory:'库存', capital:'资金', commodity:'商品', announcement:'公告',
              overseas:'海外', correlator:'关联', news:'新闻'}[src] || src;
    }
  };
}
</script>
{% endblock %}
