<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}AI产业链监控{% endblock %}</title>

  <!-- Static CSS (cache-bust) -->
  <script>document.write('<link rel="stylesheet" href="/static/css/main.css?v=' + Date.now() + '">');</script>
  <noscript><link rel="stylesheet" href="/static/css/main.css"></noscript>

  <!-- ECharts -->
  <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>

  <!-- GSAP -->
  <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/ScrollTrigger.min.js"></script>

  <!-- Alpine.js -->
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

  {% block head %}{% endblock %}
</head>
<body>

  <!-- Navigation -->
  <nav class="nav">
    <div class="nav__inner">
      <a href="/" class="nav__logo">
        <span class="nav__logo-icon">🤖</span>
        <span>AI</span>
        <span class="nav__logo-sub">产业链监控</span>
      </a>
      <div class="nav__links">
        <a href="/signals" class="nav__link {% if request.endpoint == 'signals_page' %}nav__link--active{% endif %}">
          <span>📊</span> 信号
        </a>
        <a href="/market" class="nav__link {% if request.endpoint == 'market_page' %}nav__link--active{% endif %}">
          <span>📈</span> 市场
        </a>
        <a href="/report" class="nav__link {% if request.endpoint == 'report_page' %}nav__link--active{% endif %}">
          <span>📋</span> 报告
        </a>
        <a href="/review" class="nav__link {% if request.endpoint == 'review_page' %}nav__link--active{% endif %}">
          <span>🔍</span> 复盘
        </a>
      </div>
    </div>
  </nav>

  {% block ticker %}{% endblock %}

  <!-- Main Content -->
  <main>
    {% block content %}{% endblock %}
  </main>

  <!-- Footer -->
  <footer class="footer">
    <div class="container">
      <span>AI产业链监控 v3 · 数据仅供参考，不构成投资建议</span>
      <span class="footer__right">
        <a href="/api/dashboard">API</a> ·
        <a href="/data">数据</a>
        · 采集自公开市场
      </span>
    </div>
  </footer>

  {% block scripts %}{% endblock %}
</body>
</html>
